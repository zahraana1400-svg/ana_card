<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل مهمانان</title>
<style>
body{font-family:sans-serif;background:#fffaf5;margin:0;padding:1.2rem;color:#4a3b32}
.box{max-width:560px;margin:auto}
input,button{font:inherit;padding:.8em;border-radius:12px;border:1px solid #c9a96a;width:100%;box-sizing:border-box;margin-bottom:.6rem;text-align:center}
button{background:#c9a96a;color:#fff;border:0}
.sum{display:flex;gap:.5rem;margin:1rem 0}
.sum div{flex:1;background:#fff;border:1px solid #c9a96a;border-radius:12px;padding:.7rem;text-align:center}
.sum b{display:block;font-size:1.5rem}
.row{background:#fff;border:1px solid #eadcc0;border-radius:12px;padding:.8rem;margin-bottom:.5rem}
.yes{color:#2e7d32}.no{color:#b23b3b}
#err{color:#b23b3b}
</style>
</head>
<body>
<div class="box">
<h2>پنل مهمانان</h2>
<div id="login">
<input id="slug" placeholder="نام رویداد (مثلاً ana-test)" dir="ltr">
<input id="code" placeholder="کد اختصاصی" dir="ltr">
<button id="go">نمایش پاسخ‌ها</button>
<p id="err"></p>
</div>
<div id="out" hidden>
<div class="sum">
<div><b id="nYes">0</b>حضور دارند</div>
<div><b id="nNo">0</b>حضور ندارند</div>
<div><b id="nPeople">0</b>کل نفرات</div>
</div>
<div id="list"></div>
</div>
</div>
<script>
var URL='https://zwoksymxbgtygylghlmq.supabase.co/rest/v1/rpc/get_rsvps';
var KEY='sb_publishable_Z6hhGWvY7_k3LkD2HdmUdA_kFRVLvfK';
var $=function(i){return document.getElementById(i)};
$('go').onclick=function(){
  var slug=$('slug').value.trim(),code=$('code').value.trim();
  $('err').textContent='در حال بارگذاری...';
  fetch(URL,{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_slug:slug,p_code:code})})
  .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
  .then(function(rows){
    if(!rows.length){$('err').textContent='پاسخی پیدا نشد یا نام/کد اشتباه است.';return}
    $('err').textContent='';$('login').hidden=true;$('out').hidden=false;
    var yes=0,no=0,people=0,list=$('list');list.textContent='';
    rows.forEach(function(r){
      var coming=r.attendance==='حضور دارم';
      var g=Number(r.guests||0);
      if(coming){yes++;people+=1+g}else{no++}
      var d=document.createElement('div');d.className='row';
      var a=document.createElement('b');a.textContent=r.name;
      var s=document.createElement('div');s.className=coming?'yes':'no';
      s.textContent=r.attendance+(coming&&g?' (+'+g+' همراه)':'');
      var p=document.createElement('div');p.dir='ltr';p.style.textAlign='right';p.textContent=r.phone;
      d.appendChild(a);d.appendChild(s);d.appendChild(p);list.appendChild(d);
    });
    $('nYes').textContent=yes;$('nNo').textContent=no;$('nPeople').textContent=people;
  })
  .catch(function(e){$('err').textContent='خطا: '+e.message});
};
</script>
</body>
</html>
